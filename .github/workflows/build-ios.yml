name: iOS IPA Builder

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Source repository (owner/repo)"
        required: true
        type: string
      source_ref:
        description: "Branch, tag or commit"
        required: true
        default: "main"
        type: string
      project_type:
        description: "Project type"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - xcode
          - capacitor
          - flutter
          - react-native
      build_mode:
        description: "Build output"
        required: true
        default: "unsigned"
        type: choice
        options:
          - unsigned
          - app-store
      scheme:
        description: "Xcode scheme (optional; leave blank for auto detection)"
        required: false
        type: string
      output_name:
        description: "Output IPA name without .ipa (optional)"
        required: false
        type: string
      output_visibility:
        description: "Release visibility"
        required: true
        default: "private"
        type: choice
        options:
          - private
          - public

permissions:
  contents: read

# Keep the builder on standard GitHub-hosted runners only.
concurrency:
  group: ios-ipa-builder
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate build request
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        shell: bash
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
          PROJECT_TYPE: ${{ inputs.project_type }}
          BUILD_MODE: ${{ inputs.build_mode }}
          OUTPUT_NAME: ${{ inputs.output_name }}
          OUTPUT_VISIBILITY: ${{ inputs.output_visibility }}
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::source_repo must use owner/repo format."
            exit 1
          fi

          if [[ -z "$SOURCE_REF" || ! "$SOURCE_REF" =~ ^[A-Za-z0-9._/-]+$ || "$SOURCE_REF" == -* || "$SOURCE_REF" == *".."* ]]; then
            echo "::error::source_ref contains unsupported characters or an unsafe ref."
            exit 1
          fi

          case "$PROJECT_TYPE" in
            auto|xcode|capacitor|flutter|react-native) ;;
            *)
              echo "::error::Unsupported project type."
              exit 1
              ;;
          esac

          case "$BUILD_MODE" in
            unsigned|app-store) ;;
            *)
              echo "::error::Unsupported build mode."
              exit 1
              ;;
          esac

          case "$OUTPUT_VISIBILITY" in
            private|public) ;;
            *)
              echo "::error::Unsupported output visibility."
              exit 1
              ;;
          esac

          if [[ -n "$OUTPUT_NAME" && ! "$OUTPUT_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::output_name may contain only letters, numbers, dot, underscore and dash."
            exit 1
          fi

          {
            echo "## iOS IPA Builder request"
            echo ""
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Source | `$SOURCE_REPO` |"
            echo "| Ref | `$SOURCE_REF` |"
            echo "| Project | `$PROJECT_TYPE` |"
            echo "| Mode | `$BUILD_MODE` |"
            echo "| Output visibility | `$OUTPUT_VISIBILITY` |"
            echo "| Output | `${OUTPUT_NAME:-auto}` |"
          } >> "$GITHUB_STEP_SUMMARY"

  inspect-source:
    name: Inspect source
    needs: validate-request
    runs-on: ubuntu-latest
    outputs:
      project_type: ${{ steps.detect.outputs.project_type }}
      detected_type: ${{ steps.detect.outputs.detected_type }}
      project_root: ${{ steps.detect.outputs.project_root }}
      marker: ${{ steps.detect.outputs.marker }}
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false

      - name: Fetch application source
        shell: bash
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          set -euo pipefail

          rm -rf source
          git init -q source
          git -C source remote add origin "https://github.com/$SOURCE_REPO.git"

          if [[ -n "$SOURCE_TOKEN" ]]; then
            ASKPASS="$RUNNER_TEMP/ios-builder-git-askpass.sh"
            cat > "$ASKPASS" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$SOURCE_TOKEN" ;;
            *) printf '\n' ;;
          esac
          EOF
            chmod 700 "$ASKPASS"
            export GIT_ASKPASS="$ASKPASS"
            export GIT_TERMINAL_PROMPT=0
          fi

          if ! git -C source fetch --quiet --depth=1 origin "$SOURCE_REF"; then
            echo "::error::Unable to fetch $SOURCE_REPO at ref $SOURCE_REF."
            echo "::error::For a private repository, add a fine-grained read-only token as SOURCE_TOKEN."
            exit 30
          fi

          git -C source checkout --quiet --detach FETCH_HEAD
          git -C source remote remove origin
          rm -f "${ASKPASS:-}"
          unset SOURCE_TOKEN GIT_ASKPASS GIT_TERMINAL_PROMPT

      - name: Detect project type
        id: detect
        shell: bash
        env:
          REQUESTED_TYPE: ${{ inputs.project_type }}
        run: bash builder/scripts/detect-project.sh source "$REQUESTED_TYPE"

      - name: Source summary
        shell: bash
        env:
          REQUESTED_TYPE: ${{ inputs.project_type }}
          PROJECT_TYPE: ${{ steps.detect.outputs.project_type }}
          DETECTED_TYPE: ${{ steps.detect.outputs.detected_type }}
          PROJECT_ROOT: ${{ steps.detect.outputs.project_root }}
          MARKER: ${{ steps.detect.outputs.marker }}
        run: |
          {
            echo "## Source inspection"
            echo ""
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Requested type | `$REQUESTED_TYPE` |"
            echo "| Detected type | `$DETECTED_TYPE` |"
            echo "| Build type | `$PROJECT_TYPE` |"
            echo "| Project root | `$PROJECT_ROOT` |"
            echo "| Marker | `${MARKER:-none}` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-unsigned:
    name: Build unsigned IPA
    needs: inspect-source
    if: ${{ inputs.build_mode == 'unsigned' }}
    runs-on: macos-latest
    outputs:
      ipa_name: ${{ steps.package.outputs.ipa_name }}
      ipa_sha256: ${{ steps.package.outputs.ipa_sha256 }}
      ipa_size: ${{ steps.package.outputs.ipa_size }}
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false

      - name: Setup Node.js 22 for Capacitor
        if: ${{ needs.inspect-source.outputs.project_type == 'capacitor' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Node.js 20 for React Native
        if: ${{ needs.inspect-source.outputs.project_type == 'react-native' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install official Flutter SDK
        if: ${{ needs.inspect-source.outputs.project_type == 'flutter' }}
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_DIR="$RUNNER_TEMP/flutter"
          rm -rf "$FLUTTER_DIR"
          git clone --quiet --depth=1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_DIR"
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          "$FLUTTER_DIR/bin/flutter" --version

      - name: Fetch application source
        shell: bash
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          set -euo pipefail

          rm -rf source
          git init -q source
          git -C source remote add origin "https://github.com/$SOURCE_REPO.git"

          if [[ -n "$SOURCE_TOKEN" ]]; then
            ASKPASS="$RUNNER_TEMP/ios-builder-git-askpass.sh"
            cat > "$ASKPASS" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$SOURCE_TOKEN" ;;
            *) printf '\n' ;;
          esac
          EOF
            chmod 700 "$ASKPASS"
            export GIT_ASKPASS="$ASKPASS"
            export GIT_TERMINAL_PROMPT=0
          fi

          if ! git -C source fetch --quiet --depth=1 origin "$SOURCE_REF"; then
            echo "::error::Unable to fetch $SOURCE_REPO at ref $SOURCE_REF."
            exit 60
          fi

          git -C source checkout --quiet --detach FETCH_HEAD
          git -C source remote remove origin
          rm -f "${ASKPASS:-}"
          unset SOURCE_TOKEN GIT_ASKPASS GIT_TERMINAL_PROMPT

      - name: Re-check project type
        shell: bash
        env:
          REQUESTED_TYPE: ${{ inputs.project_type }}
          EXPECTED_TYPE: ${{ needs.inspect-source.outputs.project_type }}
        run: |
          set -euo pipefail
          ACTUAL_TYPE="$(bash builder/scripts/detect-project.sh source "$REQUESTED_TYPE" | awk -F: '/Build type/{gsub(/[[:space:]]/,"",$2);print $2}')"
          if [[ "$ACTUAL_TYPE" != "$EXPECTED_TYPE" ]]; then
            echo "::error::Project type changed between inspection and build."
            exit 61
          fi

      - name: Verify standard macOS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "macOS"
          xcodebuild -version

      - name: Build and package unsigned IPA
        id: package
        shell: bash
        env:
          PROJECT_TYPE: ${{ needs.inspect-source.outputs.project_type }}
          PROJECT_ROOT: ${{ needs.inspect-source.outputs.project_root }}
          SCHEME: ${{ inputs.scheme }}
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          set -euo pipefail
          bash builder/scripts/build-unsigned.sh source "$PROJECT_TYPE" "$PROJECT_ROOT" "$SCHEME" "$OUTPUT_NAME"

      - name: Deliver IPA to private release
        id: deliver
        shell: bash
        env:
          OUTPUT_REPO: ${{ secrets.OUTPUT_REPO }}
          OUTPUT_TOKEN: ${{ secrets.OUTPUT_TOKEN }}
          OUTPUT_VISIBILITY: ${{ inputs.output_visibility }}
          IPA_PATH: ${{ steps.package.outputs.ipa_path }}
        run: |
          set -euo pipefail
          bash builder/scripts/deliver-private-release.sh "$IPA_PATH"

      - name: Build summary
        shell: bash
        env:
          IPA_NAME: ${{ steps.package.outputs.ipa_name }}
          IPA_SIZE: ${{ steps.package.outputs.ipa_size }}
          IPA_SHA256: ${{ steps.package.outputs.ipa_sha256 }}
          RELEASE_TAG: ${{ steps.deliver.outputs.release_tag }}
        run: |
          {
            echo "## Unsigned IPA built"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| File | `$IPA_NAME` |"
            echo "| Size | `$IPA_SIZE` |"
            echo "| SHA-256 | `$IPA_SHA256` |"
            echo "| Signing | `unsigned / CODE_SIGNING_ALLOWED=NO` |"
            echo "| Delivery | `${{ inputs.output_visibility }} GitHub Release` |"
            echo "| Private release tag | `$RELEASE_TAG` |"
            echo ""
            echo "> No IPA was stored as a public Actions artifact."
          } >> "$GITHUB_STEP_SUMMARY"

  app-store-not-ready:
    name: App Store mode not enabled yet
    needs: inspect-source
    if: ${{ inputs.build_mode == 'app-store' }}
    runs-on: ubuntu-latest
    steps:
      - name: Signing stage not enabled
        run: |
          echo "::error::App Store / TestFlight signing is not enabled yet. No Apple credentials were accessed."
          exit 71
