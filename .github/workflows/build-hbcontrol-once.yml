name: Build HB Control once

on:
  push:
    branches:
      - Master
    paths:
      - ".github/workflows/build-hbcontrol-once.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout builder
        uses: actions/checkout@v5

      - name: Build HB Control through Builder
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          set -euo pipefail

          REQUEST="$RUNNER_TEMP/hbcontrol-request.json"
          cat > "$REQUEST" <<'JSON'
          {
            "inputs": {
              "source_repo": "CaseyCZ/HB-Control",
              "source_ref": "Master",
              "project_path": "",
              "project_type": "xcode",
              "build_mode": "unsigned",
              "scheme": "HBControl",
              "output_name": "HBControl",
              "output_repo": "CaseyCZ/HB-Control",
              "output_visibility": "private",
              "log_mode": "private"
            }
          }
          JSON
          export GITHUB_EVENT_PATH="$REQUEST"

          bash scripts/fetch-source.sh source

          DETECT_ENV_FILE="$RUNNER_TEMP/project.env" \
            bash scripts/detect-project.sh source xcode ""
          source "$RUNNER_TEMP/project.env"

          export BUILD_ENV_FILE="$RUNNER_TEMP/build.env"
          bash scripts/build-unsigned.sh \
            source "$DETECTED_PROJECT_TYPE" "$DETECTED_PROJECT_ROOT" "HBControl" "HBControl" \
            > "$RUNNER_TEMP/private-build.log" 2>&1

          source "$RUNNER_TEMP/build.env"
          cp "$IPA_PATH" "$RUNNER_TEMP/HBControl-Builder-unsigned.ipa"
          shasum -a 256 "$RUNNER_TEMP/HBControl-Builder-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HBControl-Builder-unsigned
          path: ${{ runner.temp }}/HBControl-Builder-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
