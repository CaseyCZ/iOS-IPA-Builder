name: Builder Checks

on:
  push:
    branches:
      - Master
  pull_request:
    branches:
      - Master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-builder-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-checks:
    name: Validate builder scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            echo "Checking $script"
            bash -n "$script"
          done

      - name: Enforce runner policy
        shell: bash
        run: |
          set -euo pipefail
          INVALID="$(grep -REn '^[[:space:]]{4}runs-on:' .github/workflows | grep -Ev 'runs-on:[[:space:]]*(ubuntu-latest|macos-latest)[[:space:]]*
      - name: Confirm no Actions artifact or cache storage
        shell: bash
        run: |
          set -euo pipefail
          if grep -REni 'actions/(upload-artifact|cache)@' .github/workflows; then
            echo "::error::Actions artifact/cache storage is intentionally disabled for this builder."
            exit 1
          fi
 || true)"
          if [[ -n "$INVALID" ]]; then
            echo "$INVALID"
            echo "::error::Only ubuntu-latest and macos-latest standard GitHub-hosted runners are allowed."
            exit 1
          fi

      - name: Confirm no Actions artifact or cache storage
        shell: bash
        run: |
          set -euo pipefail
          if grep -REni 'actions/(upload-artifact|cache)@' .github/workflows; then
            echo "::error::Actions artifact/cache storage is intentionally disabled for this builder."
            exit 1
          fi
